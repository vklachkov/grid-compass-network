[package]
name = "setochka"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bstr = { version = "1.12.1", default-features = false, features = ["alloc"] }
env_filter = { version = "2.0.0", default-features = false, features = ["std"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system"] }
log = "0.4.33"
minijinja = { version = "2.24.0", features = ["json"] }
num-derive = "0.4"
num-traits = "0.2"
parking_lot = "0.12.5"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
rusqlite_migration = "2.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_urlencoded = "0.7.1"
thiserror = "2.0.20"
tiny_http = "0.12.0"
wide = "1.7.0"
xattr = "1.6.1"
zerocopy = { version = "0.8.56", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
